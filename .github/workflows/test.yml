name: First CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  run-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "=== Building Docker Image ==="
          docker build -t my-nginx-app:latest .

      - name: Test Docker Container
        run: |
          echo "=== Starting Docker Container ==="
          docker run -d -p 8080:80 --name test-container my-nginx-app:latest
          
          echo "=== Testing HTTP Endpoint ==="
          sleep 2
          curl -f http://localhost:8080 | grep "Welcome to my Dockerized Nginx App!"
          
          echo "=== Cleanup Container ==="
          docker stop test-container
          docker rm test-container
