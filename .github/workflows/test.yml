name: First CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Grants the workflow permission to push images to GHCR
permissions:
  contents: read
  packages: write

jobs:
  run-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "=== Building Docker Image ==="
          docker build -t my-nginx-app:latest .

      - name: Test Docker Container
        run: |
          echo "=== Starting Docker Container ==="
          docker run -d -p 8080:80 --name test-container my-nginx-app:latest
          
          echo "=== Testing HTTP Endpoint ==="
          sleep 2
          curl -f http://localhost:8080 | grep "Welcome to my Dockerized Nginx App!"
          
          echo "=== Cleanup Container ==="
          docker stop test-container
          docker rm test-container

      # Only log in and push to GHCR if we are on the master branch!
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/my-nginx-app:latest
