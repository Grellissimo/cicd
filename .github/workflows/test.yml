name: First CI Pipeline

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  run-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "=== Building Docker Image ==="
          docker build -t my-nginx-app:latest .

      - name: Test Docker Container
        run: |
          echo "=== Starting Docker Container ==="
          docker run -d -p 8080:80 --name test-container my-nginx-app:latest
          
          echo "=== Testing HTTP Endpoint ==="
          sleep 2
          curl -f http://localhost:8080 | grep "Welcome to my Dockerized Nginx App!"
          
          echo "=== Cleanup Container ==="
          docker stop test-container
          docker rm test-container

      # --- LOGINS ---
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- EXTRACT METADATA / TAGS ---
      - name: Extract Docker Metadata
        id: meta
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/grellissimo/my-nginx-app
            grellissimo/my-nginx-app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}

      # --- BUILD & PUSH TO BOTH REGISTRIES ---
      - name: Build and Push Images
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
